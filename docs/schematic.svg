<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Consolas, monospace" font-size="14">
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">3-Switch USB MIDI Controller (Pico 2 W) - NeuralDSP</text>

  <!-- Pico -->
  <rect x="330" y="60" width="200" height="400" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="90" text-anchor="middle" font-weight="bold">Raspberry Pi Pico 2 W</text>
  <text x="430" y="108" text-anchor="middle" font-size="12">(USB up, micro-USB to PC)</text>

  <!-- Left side pins: switches -->
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="290" y1="160" x2="330" y2="160"/>
    <line x1="290" y1="200" x2="330" y2="200"/>
    <line x1="290" y1="240" x2="330" y2="240"/>
    <line x1="290" y1="290" x2="330" y2="290"/>
  </g>
  <text x="338" y="165" font-size="12">GP10 (pin 14)</text>
  <text x="338" y="205" font-size="12">GP11 (pin 15)</text>
  <text x="338" y="245" font-size="12">GP12 (pin 16)</text>
  <text x="338" y="295" font-size="12">GND (pin 13)</text>

  <!-- Switch wires -->
  <g stroke="#1565c0" stroke-width="2" fill="none">
    <line x1="290" y1="160" x2="190" y2="160"/>
    <line x1="290" y1="200" x2="190" y2="200"/>
    <line x1="290" y1="240" x2="190" y2="240"/>
  </g>
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="290" y1="290" x2="60" y2="290"/>
    <line x1="60" y1="190" x2="60" y2="400"/>
    <line x1="60" y1="190" x2="90" y2="190"/>
  </g>

  <!-- Switches SW1..SW3 -->
  <g stroke="#000" stroke-width="2" fill="#fff">
    <circle cx="190" cy="160" r="4"/><circle cx="100" cy="160" r="4"/>
    <line x1="104" y1="160" x2="170" y2="145"/>
    <circle cx="190" cy="200" r="4"/><circle cx="100" cy="200" r="4"/>
    <line x1="104" y1="200" x2="170" y2="185"/>
    <circle cx="190" cy="240" r="4"/><circle cx="100" cy="240" r="4"/>
    <line x1="104" y1="240" x2="170" y2="225"/>
  </g>
  <text x="140" y="135" text-anchor="middle" font-size="12">SW1 (Prev / Bank-)</text>
  <text x="140" y="178" text-anchor="middle" font-size="12" fill="#555">SW2 (Next / Bank+)</text>
  <text x="140" y="262" text-anchor="middle" font-size="12">SW3 (Tap / Tuner)</text>
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="96" y1="160" x2="60" y2="160"/><line x1="96" y1="200" x2="60" y2="200"/><line x1="96" y1="240" x2="60" y2="240"/>
    <line x1="60" y1="160" x2="60" y2="400"/>
  </g>
  <!-- ground symbol -->
  <g stroke="#000" stroke-width="2">
    <line x1="60" y1="400" x2="60" y2="415"/>
    <line x1="42" y1="415" x2="78" y2="415"/>
    <line x1="48" y1="422" x2="72" y2="422"/>
    <line x1="54" y1="429" x2="66" y2="429"/>
  </g>
  <text x="60" y="450" text-anchor="middle" font-size="12">GND (common)</text>

  <!-- Right side: reserved header for future screen -->
  <g stroke="#6a1b9a" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <line x1="530" y1="160" x2="620" y2="160"/>
    <line x1="530" y1="200" x2="620" y2="200"/>
    <line x1="530" y1="260" x2="620" y2="260"/>
    <line x1="530" y1="300" x2="620" y2="300"/>
  </g>
  <text x="522" y="165" text-anchor="end" font-size="12">GP4 (pin 6)</text>
  <text x="522" y="205" text-anchor="end" font-size="12">GP5 (pin 7)</text>
  <text x="522" y="265" text-anchor="end" font-size="12">3V3 OUT (pin 36)</text>
  <text x="522" y="305" text-anchor="end" font-size="12">GND (pin 38)</text>

  <rect x="620" y="130" width="230" height="200" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="735" y="152" text-anchor="middle" font-weight="bold" fill="#6a1b9a">J_SCREEN (reserved, empty)</text>
  <text x="640" y="165" font-size="12">1  SDA  &lt;- GP4</text>
  <text x="640" y="205" font-size="12">2  SCL  &lt;- GP5</text>
  <text x="640" y="265" font-size="12">3  3V3</text>
  <text x="640" y="305" font-size="12">4  GND</text>
  <text x="735" y="325" text-anchor="middle" font-size="11" fill="#555">4-pin I2C header, nothing connected yet</text>

  <!-- USB -->
  <rect x="385" y="460" width="90" height="30" fill="#ddd" stroke="#000" stroke-width="2"/>
  <text x="430" y="480" text-anchor="middle" font-size="12">micro-USB</text>
  <text x="430" y="510" text-anchor="middle" font-size="12">to PC (USB-MIDI + power)</text>

  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#555">No resistors: GPIOs use internal pull-ups; pressing a switch connects GPIO to GND (active-low)</text>
</svg>
